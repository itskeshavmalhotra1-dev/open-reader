[project]
name = "open-reader"
version = "26.0.0"
description = "Open Reader desktop book reader with Rust PyO3 backend and wxPython UI"
requires-python = ">=3.10"
dependencies = [
    "wxPython>=4.2.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "accessible-output2>=0.17",
    "pywin32>=306",
    "pyttsx3>=2.90",
    "edge-tts>=7.0.0",
    "pygame>=2.5.0",
    "piper-tts>=1.3.0",
    "kokoro-onnx>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "maturin>=1.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
