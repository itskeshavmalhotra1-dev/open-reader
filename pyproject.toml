[project]
name = "accessible-book-reader"
version = "0.1.0"
description = "Accessible EasyReader-inspired PC book reader prototype with Rust PyO3 backend and wxPython frontend"
requires-python = ">=3.10"
dependencies = [
    "wxPython>=4.2.0",
    "pymupdf>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "accessible-output2>=0.17",
    "pywin32>=306",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "maturin>=1.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
